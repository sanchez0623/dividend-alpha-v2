# HTTPS 主站模板（由 enable_https_ip.sh 用真实证书路径渲染后写入 https.conf）
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ★ IP 证书（Let's Encrypt shortlived profile）；由 enable_https_ip.sh 签发与续期
    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ★ API + WS 反向代理到 api 容器；前缀与后端 DA_API_PREFIX 一致
    location /da/v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 前端 SPA：其余路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
