# ACME HTTP-01 / webroot 挑战（certbot 写入 certs/.well-known/acme-challenge）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ★ 证书续期挑战路径，必须走 HTTP 80
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ★ API + WS 反向代理到 api 容器；前缀与后端 DA_API_PREFIX 一致
    location /da/v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ★ 其余 HTTP：仅当 https.conf 存在（证书就绪）时才跳 https，否则纯 HTTP。
    #   try_files 对"纯配置文件"判定不可靠（worker 能 stat 却判不存在），故用 if(-f)。
    #   这是 nginx 官方认可的安全 if 用法（仅 return，不配 content handler）。
    #   https.conf 由 compose 挂载、worker 可读；证书就绪时被填充，未就绪时为空文件。
    set $https_on 0;
    if (-f /etc/nginx/conf.d/https.conf) {
        set $https_on 1;
    }
    if ($https_on = 1) {
        return 307 https://$host$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS 主站：由 enable_https_ip.sh 渲染 infra/https.conf（证书就绪后才有 443 内容）。
# 该文件由 nginx 的 conf.d/*.conf 通配自动加载，此处无需 include；
# 无证书时 https.conf 为空 => 只跑 HTTP，避免 ssl_certificate 缺失导致 nginx 起不来。
