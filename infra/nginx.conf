# ACME HTTP-01 / webroot 挑战（certbot 写入 certs/.well-known/acme-challenge）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ★ 证书续期挑战路径，必须走 HTTP 80
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ★ API + WS 反向代理到 api 容器；前缀与后端 DA_API_PREFIX 一致
    location /da/v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ★ 其余 HTTP：仅在证书真实存在时才跳 HTTPS，否则直接服务 SPA（纯 HTTP）。
    #   nginx try_files 不支持通配符，故用 IP 证书的固定路径（目录名=公网IP）。
    #   IP 变更时需同步改这一行（或由 enable_https_ip.sh 渲染）。
    #   证书就绪 → 302 到 https；未就绪 → @spa 纯 HTTP，不会跳到起不来的 443。
    location / {
        try_files /etc/letsencrypt/live/47.119.50.139/fullchain.pem @spa;
    }
    location @spa {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS 主站：由 enable_https_ip.sh 渲染 infra/https.conf（证书就绪后才有 443 内容）。
# 该文件由 nginx 的 conf.d/*.conf 通配自动加载，此处无需 include；
# 无证书时 https.conf 为空 => 只跑 HTTP，避免 ssl_certificate 缺失导致 nginx 起不来。
