# ACME HTTP-01 / webroot 挑战（certbot 写入 certs/.well-known/acme-challenge）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ★ 证书续期挑战路径，必须走 HTTP 80
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ★ API + WS 反向代理到 api 容器；前缀与后端 DA_API_PREFIX 一致
    location /da/v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ★ 其余 HTTP：仅在证书真实存在时才 301 跳 HTTPS，否则直接服务 SPA（纯 HTTP）。
    #   原写法无条件 return 301，会在证书未就绪时把流量跳到起不来的 443 → 整站打不开。
    #   try_files 探测 fullchain.pem：certbot 签发后自动启用跳转，未签发时回退 HTTP。
    location / {
        try_files /etc/letsencrypt/live/*/fullchain.pem @spa;
    }
    location @spa {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS 主站：由 enable_https_ip.sh 渲染 infra/https.conf（证书就绪后才有 443 内容）。
# 该文件由 nginx 的 conf.d/*.conf 通配自动加载，此处无需 include；
# 无证书时 https.conf 为空 => 只跑 HTTP，避免 ssl_certificate 缺失导致 nginx 起不来。
