[project]
name = "dividend-alpha"
version = "3.0.0"
description = "A 股高股息组合 · 前瞻验证系统 (Forward-only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.3", "mypy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
